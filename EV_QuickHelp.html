<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EV MechPrep — Mechanical & EV Interview Prep</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #020617;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    /* Custom subtle scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    /* Range slider styling for engineering labs */
    input[type="range"].ev-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 9999px;
      outline: none;
    }
    input[type="range"].ev-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #06b6d4;
      border: 2px solid #ecfeff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.55);
    }
    input[type="range"].ev-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #06b6d4;
      border: 2px solid #ecfeff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.55);
    }
    @keyframes pulseUrgent {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .timer-urgent {
      animation: pulseUrgent 0.85s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
  <!-- App Shell Container -->
  <div id="app-shell" class="min-h-screen w-full max-w-2xl mx-auto flex flex-col bg-slate-950 border-x border-slate-800/70 shadow-2xl">

    <!-- Top Status & XP Header -->
    <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3">
      <div class="flex items-center justify-between gap-2">
        <button type="button" onclick="navigate('home')" class="flex items-center gap-2.5 text-left group focus:outline-none">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 via-teal-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-cyan-500/20 shrink-0 group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-1.5">
              <span class="text-base font-extrabold tracking-tight text-white">EV MechPrep</span>
              <span class="text-[10px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded-md bg-cyan-500/15 text-cyan-300 border border-cyan-500/30">8 Mods</span>
            </div>
            <p id="hdr-rank" class="text-[11px] font-medium text-emerald-400">Rank: Fresh Mech Grad</p>
          </div>
        </button>

        <!-- XP, Streak & Readiness Pills -->
        <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
          <div class="px-2.5 py-1 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-bold flex items-center gap-1" title="Current Streak">
            <span>🔥</span>
            <span id="hdr-streak">0</span>
          </div>
          <div class="px-2.5 py-1 rounded-xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 text-xs font-bold" id="hdr-xp">0 XP</div>
          <div class="hidden sm:flex flex-col items-end min-w-[74px]">
            <span class="text-[10px] text-slate-400 font-semibold">Readiness <strong id="hdr-readiness" class="text-emerald-400">0%</strong></span>
            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mt-0.5">
              <div id="hdr-readiness-bar" class="h-full bg-gradient-to-r from-cyan-400 to-emerald-400 rounded-full transition-all duration-300" style="width: 0%;"></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Global Error & Recovery Banner (Hidden unless runtime/promise error occurs) -->
    <div id="global-error-banner" class="hidden mx-4 mt-3 p-3.5 rounded-2xl bg-rose-950/90 border border-rose-500/60 text-rose-100 shadow-xl">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="text-xs font-extrabold uppercase tracking-wider text-rose-300">Runtime Guard Active</p>
          <p id="global-error-text" class="text-xs text-rose-100 mt-0.5 break-words">An unexpected error was safely contained.</p>
        </div>
        <button type="button" onclick="recoverFromError()" class="px-3 py-1.5 rounded-xl bg-rose-500 hover:bg-rose-400 text-slate-950 font-bold text-xs shrink-0 transition-colors">
          Recover
        </button>
      </div>
    </div>

    <!-- Main Scrollable Content Area -->
    <main id="main-content" class="flex-1 px-4 pt-4 pb-24 space-y-4"></main>

    <!-- Bottom Navigation Bar (Home, Modules, Labs, Scenarios, Mock) -->
    <nav aria-label="Primary Navigation" class="fixed bottom-0 inset-x-0 z-40 max-w-2xl mx-auto bg-slate-950/95 backdrop-blur-md border-t border-slate-800/90 px-2 py-1.5">
      <div class="grid grid-cols-5 gap-1">
        <button type="button" id="nav-home" onclick="navigate('home')" class="nav-tab flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-cyan-400 bg-cyan-500/10 transition-all">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"></path>
          </svg>
          <span class="text-[10px] font-bold">Home</span>
        </button>

        <button type="button" id="nav-modules" onclick="navigate('modules')" class="nav-tab flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-slate-400 hover:text-white transition-all">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
          </svg>
          <span class="text-[10px] font-bold">Modules</span>
        </button>

        <button type="button" id="nav-labs" onclick="navigate('labs')" class="nav-tab flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-slate-400 hover:text-white transition-all">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          <span class="text-[10px] font-bold">Labs</span>
        </button>

        <button type="button" id="nav-scenarios" onclick="startScenarioDrill()" class="nav-tab flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-slate-400 hover:text-white transition-all">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M5.07 19h13.86c1.54 0 2.5-1.67 1.73-3L13.73 4c-.77-1.33-2.69-1.33-3.46 0L3.34 16c-.77 1.33.19 3 1.73 3z"></path>
          </svg>
          <span class="text-[10px] font-bold">Scenarios</span>
        </button>

        <button type="button" id="nav-mock" onclick="startBalancedMock()" class="nav-tab flex flex-col items-center justify-center py-1.5 px-1 rounded-xl text-slate-400 hover:text-white transition-all">
          <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span class="text-[10px] font-bold">Mock</span>
        </button>
      </div>
    </nav>

    <!-- Non-blocking In-App Modal (Zero window.alert / window.confirm usage) -->
    <div id="inapp-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-700 p-5 shadow-2xl space-y-4">
        <div>
          <h3 id="modal-title" class="text-base font-extrabold text-white">Confirm Action</h3>
          <p id="modal-message" class="text-xs text-slate-300 mt-1.5 leading-relaxed"></p>
        </div>
        <div class="flex items-center justify-end gap-2">
          <button type="button" id="modal-cancel-btn" onclick="closeModal()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition-colors">
            Cancel
          </button>
          <button type="button" id="modal-confirm-btn" class="px-3.5 py-2 rounded-xl bg-rose-500 hover:bg-rose-400 text-slate-950 text-xs font-extrabold transition-colors">
            Confirm
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. SAFE STORAGE & RUNTIME GUARD LAYER (IFRAME / SANDBOX RESILIENT)
    // =========================================================================
    const STORAGE_KEY = 'ev_mechprep_v3_state';
    const memoryStorageMap = new Map();

    const DEFAULT_PERSISTED_STATE = {
      xp: 0,
      streak: 0,
      bestStreak: 0,
      completedNotes: [],
      solvedQuestions: {} // { [questionId]: { correct: boolean, attempts: number } }
    };

    function safeGetStorageItem(key) {
      try {
        if (typeof window !== 'undefined' && window.localStorage) {
          return window.localStorage.getItem(key);
        }
      } catch (_err) {
        // Fallback to memory map when storage is blocked
      }
      return memoryStorageMap.has(key) ? memoryStorageMap.get(key) : null;
    }

    function safeSetStorageItem(key, value) {
      memoryStorageMap.set(key, String(value));
      try {
        if (typeof window !== 'undefined' && window.localStorage) {
          window.localStorage.setItem(key, String(value));
        }
      } catch (_err) {
        // Keep in-memory state working smoothly
      }
    }

    function safeRemoveStorageItem(key) {
      memoryStorageMap.delete(key);
      try {
        if (typeof window !== 'undefined' && window.localStorage) {
          window.localStorage.removeItem(key);
        }
      } catch (_err) {
        // Ignore storage removal restriction
      }
    }

    function normalizeState(raw) {
      const clean = {
        xp: 0,
        streak: 0,
        bestStreak: 0,
        completedNotes: [],
        solvedQuestions: {}
      };
      if (!raw || typeof raw !== 'object') return clean;
      clean.xp = Number.isFinite(Number(raw.xp)) && Number(raw.xp) >= 0 ? Math.floor(Number(raw.xp)) : 0;
      clean.streak = Number.isFinite(Number(raw.streak)) && Number(raw.streak) >= 0 ? Math.floor(Number(raw.streak)) : 0;
      clean.bestStreak = Number.isFinite(Number(raw.bestStreak)) && Number(raw.bestStreak) >= 0 ? Math.floor(Number(raw.bestStreak)) : 0;
      if (Array.isArray(raw.completedNotes)) {
        clean.completedNotes = raw.completedNotes.filter(item => typeof item === 'string');
      }
      if (raw.solvedQuestions && typeof raw.solvedQuestions === 'object') {
        Object.entries(raw.solvedQuestions).forEach(([qId, entry]) => {
          if (entry && typeof entry === 'object') {
            clean.solvedQuestions[qId] = {
              correct: Boolean(entry.correct),
              attempts: Number.isFinite(Number(entry.attempts)) && Number(entry.attempts) > 0 ? Math.floor(Number(entry.attempts)) : 1
            };
          }
        });
      }
      return clean;
    }

    let appState = normalizeState(DEFAULT_PERSISTED_STATE);

    function loadPersistedState() {
      try {
        const rawText = safeGetStorageItem(STORAGE_KEY);
        if (!rawText) return normalizeState(DEFAULT_PERSISTED_STATE);
        return normalizeState(JSON.parse(rawText));
      } catch (_err) {
        return normalizeState(DEFAULT_PERSISTED_STATE);
      }
    }

    function persistState() {
      appState = normalizeState(appState);
      safeSetStorageItem(STORAGE_KEY, JSON.stringify(appState));
      updateTopHeader();
    }

    function showGlobalError(message) {
      try {
        const banner = document.getElementById('global-error-banner');
        const msgEl = document.getElementById('global-error-text');
        if (msgEl) msgEl.textContent = message || 'A rendering issue was caught and contained.';
        if (banner) banner.classList.remove('hidden');
      } catch (_err) {
        // Ignore if DOM unavailable
      }
    }

    function recoverFromError() {
      try {
        const banner = document.getElementById('global-error-banner');
        if (banner) banner.classList.add('hidden');
        stopDrillTimer();
        updateTopHeader();
        navigate('home');
      } catch (_err) {
        // Ignore recovery error
      }
    }

    if (typeof window !== 'undefined') {
      window.addEventListener('error', function (event) {
        const detail = event && event.message ? event.message : 'Unexpected runtime error caught.';
        showGlobalError(detail);
      });
      window.addEventListener('unhandledrejection', function (event) {
        const reason = event && event.reason ? (event.reason.message || String(event.reason)) : 'Unhandled promise rejection caught.';
        showGlobalError(reason);
      });
    }

    // =========================================================================
    // 2. VERIFIED EXTERNAL LEARNING LINKS & 8 COMPREHENSIVE MODULES DATA
    // =========================================================================
    const VERIFIED_LINKS = {
      nptelFundamentals: {
        title: 'NPTEL (IIT Madras): Fundamentals of Electric Vehicles',
        url: 'https://nptel.ac.in/courses/108106170',
        badge: 'NPTEL IIT'
      },
      nptelComponents: {
        title: 'NPTEL (IIT Roorkee): EV Components & Charging',
        url: 'https://nptel.ac.in/courses/108107002',
        badge: 'NPTEL IIT'
      },
      mathworksAcademia: {
        title: 'MathWorks: EV Learning Resources & Simulation',
        url: 'https://www.mathworks.com/academia/student-competitions/resources/electric-vehicles.html',
        badge: 'MathWorks'
      },
      mathworksSolutions: {
        title: 'MathWorks: Electric Vehicle Solutions',
        url: 'https://www.mathworks.com/solutions/automotive/electric-vehicle.html',
        badge: 'MathWorks'
      },
      batteryUnivGuide: {
        title: 'Battery University: Lithium-ion Guide',
        url: 'https://www.batteryuniversity.com/article/lithium-ion/',
        badge: 'Battery U'
      },
      batteryUnivSafety: {
        title: 'Battery University: Understanding Lithium-ion Chemistry & Safety',
        url: 'https://www.batteryuniversity.com/article/understanding-lithium-ion/',
        badge: 'Battery U'
      },
      saeStandards: {
        title: 'SAE International: Mobility Engineering & Standards',
        url: 'https://www.sae.org/',
        badge: 'SAE'
      },
      uneceRegs: {
        title: 'UNECE: Vehicle Regulations & Safety Standards',
        url: 'https://unece.org/transport/vehicle-regulations',
        badge: 'UNECE'
      }
    };

    const MODULES = [
      {
        id: 'som-fatigue-fea',
        num: '01',
        category: 'core',
        categoryLabel: 'Core Mechanical',
        title: 'Strength of Materials, Fatigue & Structural FEA',
        shortTitle: 'SOM, Fatigue & FEA',
        subtitle: 'Von Mises stress, S-N/strain-life fatigue, bolted preload & FEA boundary conditions',
        labId: 'lab-som',
        overview: 'EV battery enclosures, motor mounts, and subframes experience combined static crush loads, thermal expansion stresses, and high-frequency road vibration. Mechanical engineers must pair yield/fatigue criteria with realistic FEA constraints and joint stiffness ratios.',
        equations: [
          { label: 'Von Mises Yield', formula: 'σ_v = √[½((σ₁−σ₂)² + (σ₂−σ₃)² + (σ₃−σ₁)² + 6(τ₁₂² + τ₂₃² + τ₃₁²))]' },
          { label: 'Miner’s Fatigue Rule', formula: 'D = Σ (n_i / N_i)  (Design target typically D < 0.3–0.5 for safety-critical parts)' },
          { label: 'Bolt Joint Stiffness', formula: 'C = k_b / (k_b + k_m),   F_b = C · F_ext + F_preload' }
        ],
        interviewerTip: 'When asked how you validate an FEA model, always state mesh convergence checks, constraint/contact realism (avoiding over-constrained rigid links that create artificial stress spikes), and correlation against physical strain-gauge or modal tests.',
        crossBridge: 'Battery pack structural deflection (>2–3 mm under load) can stress busbars, crack potting/TIM layers, or pinch cell tabs—requiring mechanical stiffness targets negotiated directly with Electrical/BMS and Thermal teams.',
        links: [VERIFIED_LINKS.saeStandards, VERIFIED_LINKS.mathworksSolutions, VERIFIED_LINKS.nptelFundamentals],
        questions: [
          {
            id: 'q-som-1',
            domain: 'core',
            isScenario: false,
            prompt: 'In structural FEA of an aluminum battery tray under vertical road bump load, why should you check mesh convergence before signing off on peak stress?',
            options: [
              'Fine meshes automatically eliminate stress concentrations at sharp internal corners',
              'Coarse meshes can under-predict gradients while sharp re-entrant corners cause mesh-dependent singularities',
              'Mesh density only affects thermal conductivity, not von Mises stress',
              'Increasing element count reduces allowable yield strength of 6061-T6 aluminum'
            ],
            correctIndex: 1,
            explanation: 'Coarse elements can smooth out steep stress gradients, whereas true geometric re-entrant corners create theoretical singularities unless modeled with fillet radii and evaluated via converged mesh behavior or local strain/notch methods.'
          },
          {
            id: 'q-som-2',
            domain: 'core',
            isScenario: false,
            prompt: 'A bracket undergoes reversed bending with alternating stress σ_a and mean stress σ_m. Which effect directly shortens fatigue life for a given alternating amplitude?',
            options: [
              'Tensile mean stress reduces allowable alternating stress amplitude',
              'Compressive mean stress always makes fatigue life zero',
              'Mean stress has zero effect on ductile metals above room temperature',
              'Higher frequency always doubles endurance limit in steel'
            ],
            correctIndex: 0,
            explanation: 'A tensile mean stress shifts the stress cycle upward (Goodman/Gerber relations), reducing the allowable alternating stress amplitude for a target fatigue life.'
          },
          {
            id: 'q-som-3',
            domain: 'core',
            isScenario: false,
            prompt: 'Why is a metallic compression limiter (bushing/sleeve) commonly placed inside a polymer mounting flange bolted to a metal housing?',
            options: [
              'To increase electrical conductivity across the flange',
              'To prevent polymer creep/relaxation from losing bolt clamping preload over time and temperature',
              'To lower the natural frequency of the fastener',
              'To replace thread locking compound on aluminum bolts'
            ],
            correctIndex: 1,
            explanation: 'Polymers creep under sustained compressive clamping load and elevated temperatures. A rigid metal limiter defines exact crush height and preserves clamping preload.'
          },
          {
            id: 'q-som-4',
            domain: 'cross',
            isScenario: true,
            prompt: 'SCENARIO: During a 200,000 km accelerated vibration schedule, a rigid copper busbar bolted between two battery modules cracks near its lug root even though peak static stress is well below yield. What is the most likely root cause?',
            options: [
              'High-cycle vibrational fatigue amplified by differential displacement between modules and a sharp bend radius',
              'Pure hydrostatic pressure inside the copper conductor',
              'A drop in ambient air density at highway speed',
              'Excessive corrosion resistance of oxygen-free copper'
            ],
            correctIndex: 0,
            explanation: 'Relative vibration between modules imposes cyclic bending on the busbar. Tight bend radii and lack of strain relief/compliance cause cyclic plastic strain accumulation and fatigue cracking.'
          },
          {
            id: 'q-som-5',
            domain: 'cross',
            isScenario: true,
            prompt: 'SCENARIO: A structural engineer stiffens a battery enclosure cross-member by 40%, reducing vertical deflection by half, but BMS engineers report higher cell-to-cell compression variation during thermal expansion. What trade-off occurred?',
            options: [
              'Higher structural stiffness restricts free thermal expansion, raising reaction forces on constrained cells',
              'Stiffer cross-members reduce the Young’s modulus of lithium cells',
              'Thermal expansion disappears when structural stiffness exceeds 50 kN/mm',
              'BMS voltage sensors automatically cancel mechanical clamping forces'
            ],
            correctIndex: 0,
            explanation: 'When a stiffer structure constrains thermal growth (ΔL = α·L·ΔT), thermal strain converts into higher mechanical contact/reaction stress across the cell stack.'
          }
        ]
      },
      {
        id: 'heat-thermo-fluids',
        num: '02',
        category: 'core',
        categoryLabel: 'Core Mechanical',
        title: 'Heat Transfer, Thermodynamics & Fluid Mechanics',
        shortTitle: 'Heat, Thermo & Fluids',
        subtitle: 'Conduction resistance networks, Reynolds/Nusselt convection, pressure drop & heat generation',
        labId: 'lab-heat',
        overview: 'Thermal reliability governs EV fast-charging speed, cell longevity, and inverter power limits. Mechanical engineers balance conductive stack resistance, convective heat transfer coefficients, and fluid pumping power (ΔP · Q) across cooling loops.',
        equations: [
          { label: '1D Conduction & Contact', formula: 'R_th = t / (k · A) + R_contact,   Q̇ = ΔT / R_th_total' },
          { label: 'Convection & Energy Balance', formula: 'Q̇_conv = h · A_s · (T_s − T_f) = ṁ · c_p · (T_out − T_in)' },
          { label: 'Darcy–Weisbach Head Loss', formula: 'ΔP = f · (L / D_h) · (ρ · V² / 2),   P_pump = (ΔP · Q̇) / η_pump' }
        ],
        interviewerTip: 'Always check both local wall temperature AND bulk coolant temperature rise (ΔT = Q̇ / (ṁ·c_p)). A high flow rate with terrible thermal contact resistance still leaves cells hot!',
        crossBridge: 'Cell internal resistance R_int rises sharply at cold temperatures and generates I²R + entropic heat during fast DC charging—coupling electrochemistry and BMS charge-rate limits directly to fluid loop capacity.',
        links: [VERIFIED_LINKS.nptelComponents, VERIFIED_LINKS.mathworksSolutions, VERIFIED_LINKS.batteryUnivSafety],
        questions: [
          {
            id: 'q-ht-1',
            domain: 'core',
            isScenario: false,
            prompt: 'For a fixed heat input Q̇ into a liquid-cooled cold plate with constant specific heat c_p, what happens to coolant temperature rise (T_out − T_in) if mass flow rate ṁ is doubled?',
            options: [
              'It is cut in half',
              'It doubles',
              'It stays identical regardless of flow rate',
              'It drops to zero'
            ],
            correctIndex: 0,
            explanation: 'From steady-state energy balance Q̇ = ṁ · c_p · (T_out − T_in), doubling ṁ for the same Q̇ halves (T_out − T_in).'
          },
          {
            id: 'q-ht-2',

                <span id="nvh-f-badge" class="text-xs font-extrabold px-2 py-0.5 rounded-lg bg-cyan-500/15 text-cyan-300">f_mesh: 4,000 Hz</span>

                  <input type="range" min="2000" max="20000" step="500" value="12000" oninput="updateLabNVH()" id="nvh-rpm" class="ev-slider"/>

    }

    function updateLabSOM() {
      const sEl = document.getElementById('som-stress');
      const aEl = document.getElementById('som-allow');
      if (!sEl || !aEl) return;
      const sigma = Number(sEl.value) || 135;
      const allow = Number(aEl.value) || 270;
      const fos = allow / Math.max(sigma, 1);
      const badge = document.getElementById('som-fos-badge');
      const note = document.getElementById('som-note');
      document.getElementById('som-stress-val').textContent = `${sigma} MPa`;
      document.getElementById('som-allow-val').textContent = `${allow} MPa`;
      if (badge) {
        badge.textContent = `FoS: ${fos.toFixed(2)}`;
        badge.className = `text-xs font-extrabold px-2 py-0.5 rounded-lg ${fos >= 1.5 ? 'bg-emerald-500/15 text-emerald-300' : fos >= 1.0 ? 'bg-amber-500/15 text-amber-300' : 'bg-rose-500/15 text-rose-300'}`;
      }
      if (note) {
        note.textContent = fos >= 1.5 ? 'Comfortable margin; verify stress concentrations, bolts & fatigue cycles.' : fos >= 1.0 ? 'Tight margin—review load factors, fillets & cyclic fatigue.' : 'Yield/limit exceeded—increase section modulus or material strength.';
      }
    }

    function updateLabHeat() {
      const qEl = document.getElementById('heat-q');
      const fEl = document.getElementById('heat-m');
      if (!qEl || !fEl) return;
      const qKw = Number(qEl.value) || 10;
      const lpm = Number(fEl.value) || 10;
      const mDot = (lpm / 60) * 1.05; // kg/s
      const cp = 3.55; // kJ/(kg*K)
      const dT = qKw / Math.max(mDot * cp, 0.01);
      document.getElementById('heat-q-val').textContent = `${qKw.toFixed(1)} kW`;
      document.getElementById('heat-m-val').textContent = `${lpm.toFixed(1)} L/min`;
      const badge = document.getElementById('heat-dt-badge');
      if (badge) {
        badge.textContent = `ΔT: ${dT.toFixed(2)} °C`;
        badge.className = `text-xs font-extrabold px-2 py-0.5 rounded-lg ${dT <= 6 ? 'bg-emerald-500/15 text-emerald-300' : dT <= 10 ? 'bg-cyan-500/15 text-cyan-300' : 'bg-amber-500/15 text-amber-300'}`;
      }
    }

    function updateLabGear() {
      const pEl = document.getElementById('gear-p');
      const tEl = document.getElementById('gear-type');
      if (!pEl || !tEl) return;
      const pRatio = Number(pEl.value) || 1.0;
      const expP = Number(tEl.value) || 3.0;
      const lifeFactor = Math.pow(1 / Math.max(pRatio, 0.1), expP);
      document.getElementById('gear-p-val').textContent = `${pRatio.toFixed(2)}×`;
      document.getElementById('gear-type-val').textContent = expP > 3.1 ? 'Roller (p = 3.33)' : 'Ball (p = 3.0)';
      const badge = document.getElementById('gear-life-badge');
      const note = document.getElementById('gear-note');
      if (badge) {
        badge.textContent = `Life Factor: ${lifeFactor.toFixed(2)}×`;
        badge.className = `text-xs font-extrabold px-2 py-0.5 rounded-lg ${lifeFactor >= 1 ? 'bg-emerald-500/15 text-emerald-300' : 'bg-rose-500/15 text-rose-300'}`;
      }
      if (note) {
        note.textContent = `L10 life scales as (1 / load_ratio)^${expP.toFixed(2)}.`;
      }
    }

    function updateLabGDT() {
      const gapEl = document.getElementById('gdt-gap');
      const kEl = document.getElementById('gdt-k');
      if (!gapEl || !kEl) return;
      const gapMm = Number(gapEl.value) || 0.5;
      const kTim = Number(kEl.value) || 2.0;
      const areaM2 = 0.01; // 100 cm^2
      const rTh = (gapMm * 0.001) / (kTim * areaM2);
      document.getElementById('gdt-gap-val').textContent = `${gapMm.toFixed(2)} mm`;
      document.getElementById('gdt-k-val').textContent = `${kTim.toFixed(1)} W/m·K`;
      const badge = document.getElementById('gdt-rth-badge');
      if (badge) {
        badge.textContent = `TIM R_th: ${rTh.toFixed(2)} K/W`;
      }
    }

    function updateLabDyn() {
      const vEl = document.getElementById('dyn-v');
      const gEl = document.getElementById('dyn-g');
      if (!vEl || !gEl) return;
      const vKmh = Number(vEl.value) || 100;
      const gradePct = Number(gEl.value) || 0;
      const vMs = vKmh / 3.6;
      const mass = 1800;
      const g = 9.81;
      const theta = Math.atan(gradePct / 100);
      const fRoll = mass * g * 0.01 * Math.cos(theta);
      const fGrade = mass * g * Math.sin(theta);
      const fAero = 0.5 * 1.2 * 0.62 * vMs * vMs;
      const pKw = ((fRoll + fGrade + fAero) * vMs) / 1000;
      document.getElementById('dyn-v-val').textContent = `${vKmh} km/h`;
      document.getElementById('dyn-g-val').textContent = `${gradePct.toFixed(1)} %`;
      const badge = document.getElementById('dyn-ptot-badge');
      const note = document.getElementById('dyn-note');
      if (badge) badge.textContent = `Total: ${pKw.toFixed(1)} kW`;
      if (note) {
        const pAero = (fAero * vMs) / 1000;
        const pGrade = (fGrade * vMs) / 1000;
        note.textContent = `Aero: ${pAero.toFixed(1)} kW | Grade: ${pGrade.toFixed(1)} kW | Roll: ${((fRoll * vMs) / 1000).toFixed(1)} kW.`;
      }
    }

    function updateLabPack() {
      const cEl = document.getElementById('pack-cell');
      const oEl = document.getElementById('pack-overhead');
      if (!cEl || !oEl) return;
      const cellWhKg = Number(cEl.value) || 240;
      const overheadPct = Number(oEl.value) || 32;
      const packWhKg = cellWhKg * (1 - overheadPct / 100);
      document.getElementById('pack-cell-val').textContent = `${cellWhKg} Wh/kg`;
      document.getElementById('pack-overhead-val').textContent = `${overheadPct} %`;
      const badge = document.getElementById('pack-dens-badge');
      if (badge) badge.textContent = `Pack: ${Math.round(packWhKg)} Wh/kg`;
    }

    function updateLabBTMS() {
      const iEl = document.getElementById('btms-i');
      const rEl = document.getElementById('btms-r');
      if (!iEl || !rEl) return;
      const curr = Number(iEl.value) || 200;
      const res = Number(rEl.value) || 0.4;
      const qKw = (curr * curr * res) / 1000;
      document.getElementById('btms-i-val').textContent = `${curr} A`;
      document.getElementById('btms-r-val').textContent = `${res.toFixed(2)} Ω`;
      const badge = document.getElementById('btms-q-badge');
      if (badge) badge.textContent = `Joule Heat: ${qKw.toFixed(1)} kW`;
    }

    function updateLabNVH() {
      const rpmEl = document.getElementById('nvh-rpm');
      const zEl = document.getElementById('nvh-z');
      if (!rpmEl || !zEl) return;
      const rpm = Number(rpmEl.value) || 12000;
      const teeth = Number(zEl.value) || 20;
      const fMesh = (teeth * rpm) / 60;
      document.getElementById('nvh-rpm-val').textContent = `${rpm.toLocaleString()} RPM`;
      document.getElementById('nvh-z-val').textContent = `${teeth} teeth`;
      const badge = document.getElementById('nvh-f-badge');
      if (badge) badge.textContent = `f_mesh: ${Math.round(fMesh).toLocaleString()} Hz`;
    }

    function syncAllActiveLabs() {
      updateLabSOM();
      updateLabHeat();
      updateLabGear();
      updateLabGDT();
      updateLabDyn();
      updateLabPack();
      updateLabBTMS();
      updateLabNVH();
    }

    // =========================================================================
    // 4. PROGRESS, RANK & ANALYTICS HELPERS
    // =========================================================================
    function getAllQuestions() {
      const list = [];
      MODULES.forEach(mod => {
        mod.questions.forEach(q => {
          list.push({
            ...q,
            moduleId: mod.id,
            moduleNum: mod.num,
            moduleTitle: mod.shortTitle,
            moduleCategory: mod.category
          });
        });
      });
      return list;
    }

    function getRankTitle(xp) {
      if (xp >= 1500) return 'Principal EV Mech Fellow';
      if (xp >= 900) return 'Senior Powertrain & Pack Eng';
      if (xp >= 450) return 'EV Systems Associate';
      if (xp >= 150) return 'Junior Mech-EV Engineer';
      return 'Fresh Mech Grad';
    }

    function calculateReadinessScore() {
      const allQ = getAllQuestions();
      const totalItems = MODULES.length + allQ.length;
      if (totalItems === 0) return 0;
      const notesDone = appState.completedNotes.length;
      const solvedCorrect = Object.values(appState.solvedQuestions).filter(v => v && v.correct).length;
      return Math.min(100, Math.round(((notesDone + solvedCorrect) / totalItems) * 100));
    }

    function updateTopHeader() {
      try {
        const xpEl = document.getElementById('hdr-xp');
        const streakEl = document.getElementById('hdr-streak');
        const rankEl = document.getElementById('hdr-rank');
        const readEl = document.getElementById('hdr-readiness');
        const barEl = document.getElementById('hdr-readiness-bar');
        const readiness = calculateReadinessScore();

        if (xpEl) xpEl.textContent = `${appState.xp} XP`;
        if (streakEl) streakEl.textContent = `${appState.streak}`;
        if (rankEl) rankEl.textContent = `Rank: ${getRankTitle(appState.xp)}`;
        if (readEl) readEl.textContent = `${readiness}%`;
        if (barEl) barEl.style.width = `${readiness}%`;
      } catch (_err) {
        // Ignore header update error
      }
    }

    // 5. MODAL & RESET CONTROLS
    // =========================================================================
    function openConfirmModal(title, message, onConfirm) {
      const modal = document.getElementById('inapp-modal');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');

    function requestResetProgress() {
      openConfirmModal(
        'Reset All Progress?',
        'This clears your XP, streak, completed study notes, and solved question history.',
        function () {
          appState = normalizeState(DEFAULT_PERSISTED_STATE);

      );

    // =========================================================================
    // 6. DRILL & MOCK INTERVIEW ENGINE (TIMED + SCENARIOS + 12-Q MOCK)
    // =========================================================================
    let drill = {
      mode: 'module', // 'module' | 'scenario' | 'mock'
      title: '',
      moduleId: null,
      questions: [],
      index: 0,
      maxSeconds: 45,
      secondsLeft: 45,
      timerId: null,
      answered: false,
      selectedOption: null,
      correctCount: 0,
      xpEarned: 0,
      timeBonusEarned: 0,
      results: [] // { q, isCorrect, timedOut, selectedOption }
    };

    function stopDrillTimer() {
      if (drill.timerId) {
        clearInterval(drill.timerId);
        drill.timerId = null;
      }
    }

    function startModuleDrill(moduleId) {
      const mod = MODULES.find(m => m.id === moduleId);
      if (!mod) return;
      const qs = mod.questions.map(q => ({
        ...q,
        moduleId: mod.id,
        moduleNum: mod.num,
        moduleTitle: mod.shortTitle,
        moduleCategory: mod.category
      }));
      launchDrillSession({
        mode: 'module',
        title: `Mod ${mod.num}: ${mod.shortTitle} Drill`,
        moduleId: mod.id,
        questions: qs,
        secondsPerQuestion: 45
      });
    }

    function startScenarioDrill() {
      const allQ = getAllQuestions();
      const scenarioPool = allQ.filter(q => q.isScenario);
      const selected = scenarioPool.length >= 8 ? scenarioPool.slice(0, 8) : allQ.slice(0, 8);
      launchDrillSession({
        mode: 'scenario',
        title: 'Scenario & Cross-Disciplinary Drill',
        moduleId: null,
        questions: selected,
        secondsPerQuestion: 50
      });
    }

    function startBalancedMock() {
      const corePool = getAllQuestions().filter(q => q.moduleCategory === 'core');
      const evPool = getAllQuestions().filter(q => q.moduleCategory === 'ev');

      // Pick 6 Core Mechanical + 6 EV Systems for a balanced 12-question mock
      const pickEvenly = (pool, count) => {
        const chosen = [];
        const step = Math.max(1, Math.floor(pool.length / count));
        for (let i = 0; i < pool.length && chosen.length < count; i += step) {
          chosen.push(pool[i]);
        }
        for (let i = 0; i < pool.length && chosen.length < count; i++) {
          if (!chosen.includes(pool[i])) chosen.push(pool[i]);
        }
        return chosen.slice(0, count);
      };

      const balanced12 = [...pickEvenly(corePool, 6), ...pickEvenly(evPool, 6)];
      launchDrillSession({
        mode: 'mock',
        title: 'Balanced 12-Q Mock Interview',
        moduleId: null,
        questions: balanced12,
        secondsPerQuestion: 45
      });
    }

    function launchDrillSession(config) {
      try {
        stopDrillTimer();
        drill = {
          mode: config.mode,
          title: config.title,
          moduleId: config.moduleId,
          questions: config.questions,
          index: 0,
          maxSeconds: config.secondsPerQuestion || 45,
          secondsLeft: config.secondsPerQuestion || 45,
          timerId: null,
          answered: false,
          selectedOption: null,
          correctCount: 0,
          xpEarned: 0,
          timeBonusEarned: 0,
          results: []
        };
        setActiveNavTab(config.mode === 'scenario' ? 'scenarios' : config.mode === 'mock' ? 'mock' : 'modules');
        renderDrillQuestion();
        startQuestionCountdown();
      } catch (err) {
        showGlobalError(err && err.message ? err.message : 'Unable to launch drill.');
      }
    }

    function startQuestionCountdown() {
      stopDrillTimer();
      drill.secondsLeft = drill.maxSeconds;
      updateTimerVisuals();

      drill.timerId = setInterval(function () {
        if (drill.answered) {
          stopDrillTimer();
          return;
        }
        drill.secondsLeft -= 1;
        updateTimerVisuals();

        if (drill.secondsLeft <= 0) {
          stopDrillTimer();
          submitDrillAnswer(null, true);
        }
      }, 1000);
    }

    function updateTimerVisuals() {
      const badge = document.getElementById('drill-timer-badge');
      const bar = document.getElementById('drill-timer-bar');
      if (!badge || !bar) return;

      const sec = Math.max(0, drill.secondsLeft);
      const pct = Math.max(0, Math.min(100, (sec / drill.maxSeconds) * 100));
      badge.textContent = `${sec}s`;
      bar.style.width = `${pct}%`;

      badge.classList.remove('text-cyan-300', 'bg-cyan-500/15', 'border-cyan-500/30', 'text-amber-300', 'bg-amber-500/15', 'border-amber-500/30', 'text-rose-300', 'bg-rose-500/15', 'border-rose-500/30', 'timer-urgent');
      bar.classList.remove('bg-cyan-400', 'bg-amber-400', 'bg-rose-500');

      if (sec <= 8) {
        badge.classList.add('text-rose-300', 'bg-rose-500/15', 'border-rose-500/30', 'timer-urgent');
        bar.classList.add('bg-rose-500');
      } else if (sec <= 18) {
        badge.classList.add('text-amber-300', 'bg-amber-500/15', 'border-amber-500/30');
        bar.classList.add('bg-amber-400');
      } else {
        badge.classList.add('text-cyan-300', 'bg-cyan-500/15', 'border-cyan-500/30');
        bar.classList.add('bg-cyan-400');
      }
    }

    function submitDrillAnswer(optionIndex, timedOut = false) {
      if (drill.answered) return;
      stopDrillTimer();
      drill.answered = true;
      drill.selectedOption = optionIndex;

      const currentQ = drill.questions[drill.index];
      const isCorrect = !timedOut && optionIndex === currentQ.correctIndex;

      // Update persisted question record
      const prevRec = appState.solvedQuestions[currentQ.id] || { correct: false, attempts: 0 };
      appState.solvedQuestions[currentQ.id] = {
        correct: prevRec.correct || isCorrect,
        attempts: prevRec.attempts + 1
      };

      let gainedXp = 0;
      let bonusXp = 0;

      if (isCorrect) {
        drill.correctCount += 1;
        appState.streak += 1;
        if (appState.streak > appState.bestStreak) {
          appState.bestStreak = appState.streak;
        }
        const baseXp = currentQ.isScenario ? 35 : 25;
        bonusXp = Math.max(0, Math.round((drill.secondsLeft / drill.maxSeconds) * 15));
        gainedXp = baseXp + bonusXp;
      } else {
        appState.streak = 0;
        gainedXp = 5; // Participation/learning XP
      }

      appState.xp += gainedXp;
      drill.xpEarned += gainedXp;
      drill.timeBonusEarned += bonusXp;
      persistState();

      drill.results.push({
        q: currentQ,
        isCorrect,
        timedOut,
        selectedOption: optionIndex
      });

      renderDrillQuestion();
    }

    function nextDrillQuestion() {
      if (drill.index + 1 < drill.questions.length) {
        drill.index += 1;
        drill.answered = false;
        drill.selectedOption = null;
        renderDrillQuestion();
        startQuestionCountdown();
      } else {
        stopDrillTimer();
        renderDrillScorecard();
      }
    }

      const container = document.getElementById('main-content');
      if (!container) return;

      const q = drill.questions[drill.index];

        let btnStyle = 'bg-slate-900/90 border-slate-700/80 text-slate-200 hover:border-cyan-500/60 hover:bg-slate-800/80';

        if (drill.answered) {
          if (idx === q.correctIndex) {
            btnStyle = 'bg-emerald-950/70 border-emerald-400 text-emerald-100';
            letterStyle = 'bg-emerald-500 text-slate-950 border-emerald-400';

          } else {

            </div>

              ${drill.index + 1 < total ? 'Next Question →' : 'View Interview Scorecard →'}

      })() : '';

      container.innerHTML = `

            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">

                Mod ${q.moduleNum}: ${escapeHTML(q.moduleTitle)}
              </span>
              ${q.isScenario ? '<span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md bg-amber-500/15 text-amber-300 border border-amber-500/30">Scenario / Cross</span>' : ''}

          <!-- Options List -->

          <!-- Explanation / Next -->

        </div>`;

      updateTimerVisuals();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderDrillScorecard() {
      const container = document.getElementById('main-content');
      if (!container) return;

      const total = drill.results.length || 1;
      const accuracy = Math.round((drill.correctCount / total) * 100);

      // Breakdown across Core Mech, EV Systems, and Cross/Case
      const calcBreakdown = (predicate) => {
        const subset = drill.results.filter(r => predicate(r.q));
        if (subset.length === 0) return { right: 0, total: 0, pct: 0 };
        const right = subset.filter(r => r.isCorrect).length;
        return { right, total: subset.length, pct: Math.round((right / subset.length) * 100) };
      };

      const coreStat = calcBreakdown(q => q.moduleCategory === 'core');
      const evStat = calcBreakdown(q => q.moduleCategory === 'ev');
      const caseStat = calcBreakdown(q => Boolean(q.isScenario));

      const reviewItemsHtml = drill.results.map((item, idx) => `
        <div class="p-3 rounded-xl bg-slate-950/70 border ${item.isCorrect ? 'border-emerald-500/30' : 'border-rose-500/30'} space-y-1">
          <div class="flex items-center justify-between gap-2">
            <span class="text-[11px] font-bold text-slate-400">Q${idx + 1} · Mod ${item.q.moduleNum} ${item.q.isScenario ? '· Scenario' : ''}</span>
            <span class="text-[11px] font-extrabold ${item.isCorrect ? 'text-emerald-400' : 'text-rose-400'}">${item.timedOut ? 'Timed Out' : item.isCorrect ? 'Correct' : 'Missed'}</span>
          </div>
          <p class="text-xs font-semibold text-slate-100">${escapeHTML(item.q.prompt)}</p>
          <p class="text-[11px] text-slate-400 leading-relaxed"><strong class="text-cyan-300">Key Takeaway:</strong> ${escapeHTML(item.q.explanation)}</p>
        </div>`).join('');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="rounded-2xl bg-gradient-to-br from-slate-900 via-slate-900 to-cyan-950/40 border border-cyan-500/30 p-5 text-center space-y-3">
            <p class="text-xs font-bold uppercase tracking-wider text-cyan-300">${escapeHTML(drill.title)} Complete</p>
            <div class="text-4xl font-extrabold text-white">${accuracy}%</div>
            <p class="text-xs text-slate-300">You answered <strong class="text-emerald-400">${drill.correctCount}</strong> of <strong>${drill.results.length}</strong> questions accurately · Earned <strong class="text-amber-300">+${drill.xpEarned} XP</strong> (Speed Bonus: +${drill.timeBonusEarned} XP)</p>
          </div>

          <!-- Domain & Scenario Breakdown -->
          <div class="grid grid-cols-3 gap-2.5">
            <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3 text-center">
              <p class="text-[10px] font-bold uppercase text-indigo-300">Core Mech</p>
              <p class="text-lg font-extrabold text-white mt-0.5">${coreStat.total ? `${coreStat.pct}%` : '—'}</p>
              <p class="text-[10px] text-slate-400">${coreStat.right}/${coreStat.total}</p>
            </div>
            <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3 text-center">
              <p class="text-[10px] font-bold uppercase text-teal-300">EV Systems</p>
              <p class="text-lg font-extrabold text-white mt-0.5">${evStat.total ? `${evStat.pct}%` : '—'}</p>
              <p class="text-[10px] text-slate-400">${evStat.right}/${evStat.total}</p>
            </div>
            <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3 text-center">
              <p class="text-[10px] font-bold uppercase text-amber-300">Cross / Case</p>
              <p class="text-lg font-extrabold text-white mt-0.5">${caseStat.total ? `${caseStat.pct}%` : '—'}</p>
              <p class="text-[10px] text-slate-400">${caseStat.right}/${caseStat.total}</p>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="startBalancedMock()" class="py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-400 to-emerald-400 text-slate-950 font-extrabold text-xs sm:text-sm">
              New 12-Q Mock
            </button>
            <button type="button" onclick="navigate('modules')" class="py-3 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs sm:text-sm">
              Back to Modules
            </button>
          </div>

          <!-- Question Review -->
          <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-2.5">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-300">Post-Drill Technical Review</h3>
            <div class="space-y-2">${reviewItemsHtml}</div>
          </div>
        </div>`;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 7. VIEW RENDERERS (HOME, MODULES, MODULE DETAIL, LABS)
    // =========================================================================
    let selectedModuleFilter = 'all'; // 'all' | 'core' | 'ev'

    function navigate(viewName, moduleId = null) {
      try {
        stopDrillTimer();
        if (viewName === 'home') {
          setActiveNavTab('home');
          renderHomeView();
        } else if (viewName === 'modules') {
          setActiveNavTab('modules');
          renderModulesListView();
        } else if (viewName === 'module-detail') {
          setActiveNavTab('modules');
          renderModuleDetailView(moduleId);
        } else if (viewName === 'labs') {
          setActiveNavTab('labs');
          renderVisualLabsView();
        } else {
          setActiveNavTab('home');
          renderHomeView();
        }
      } catch (err) {
        showGlobalError(err && err.message ? err.message : 'Navigation error caught.');
      }
    }

              <p class="text-lg font-extrabold text-cyan-300 mt-0.5">${solvedCount}<span class="text-xs text-slate-500 font-semibold">/${allQ.length}</span></p>

            <div class="rounded-2xl bg-slate-900 border border-slate-800 p-3">

              <p class="text-lg font-extrabold text-amber-300 mt-0.5">${appState.bestStreak}</p>
            </div>
          </section>

          <!-- Quick Mode Cards -->
          <section class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <button type="button" onclick="navigate('modules')" class="text-left rounded-2xl bg-slate-900 hover:bg-slate-800/80 border border-slate-800 p-4 transition-all space-y-1">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-indigo-300 uppercase">01–08 Modules</span>
                <span class="text-xs text-cyan-400 font-bold">Explore →</span>
              </div>
              <p class="text-sm font-bold text-white">Study Notes, Schematics &amp; Drills</p>
              <p class="text-xs text-slate-400">4 Core Mechanical + 4 EV Systems modules with equations &amp; cross-domain bridges.</p>
            </button>

            <button type="button" onclick="navigate('labs')" class="text-left rounded-2xl bg-slate-900 hover:bg-slate-800/80 border border-slate-800 p-4 transition-all space-y-1">
              <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-teal-300 uppercase">Visual Labs</span>
                <span class="text-xs text-cyan-400 font-bold">Open Labs →</span>
              </div>
              <p class="text-sm font-bold text-white">8 SVG Schematics &amp; Live Calculators</p>

                  <span class="font-medium text-cyan-300 truncate">${escapeHTML(link.title)}</span>
                  <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 shrink-0">${escapeHTML(link.badge)}</span>

    function filterModules(filterKey) {
      selectedModuleFilter = filterKey;
      renderModulesListView();
    }

    function renderModulesListView() {
      const container = document.getElementById('main-content');
      if (!container) return;

      const filtered = MODULES.filter(m => {
        if (selectedModuleFilter === 'all') return true;

      const tabCls = (key) => selectedModuleFilter === key
        ? 'px-3 py-1.5 rounded-xl bg-cyan-500 text-slate-950 font-extrabold text-xs'

      const cardsHtml = filtered.map(mod => {
        const solvedInMod = mod.questions.filter(q => appState.solvedQuestions[q.id]?.correct).length;
        const noteDone = appState.completedNotes.includes(mod.id);
        return `
          <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div class="space-y-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xs font-extrabold text-cyan-400">MOD ${mod.num}</span>
                  <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md ${mod.category === 'core' ? 'bg-indigo-500/15 text-indigo-300 border border-indigo-500/30' : 'bg-teal-500/15 text-teal-300 border border-teal-500/30'}">${mod.categoryLabel}</span>
                  ${noteDone ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/15 text-emerald-300">✓ Notes Read</span>' : ''}
                </div>
                <h3 class="text-sm sm:text-base font-bold text-white leading-snug">${escapeHTML(mod.title)}</h3>
                <p class="text-xs text-slate-400 leading-relaxed">${escapeHTML(mod.subtitle)}</p>
              </div>
              <span class="text-xs font-bold text-slate-300 bg-slate-950 px-2.5 py-1 rounded-xl border border-slate-800 shrink-0">${solvedInMod}/${mod.questions.length}</span>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
              <button type="button" onclick="navigate('module-detail', '${mod.id}')" class="py-2 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs transition-colors">
                Study &amp; Lab
              </button>
              <button type="button" onclick="startModuleDrill('${mod.id}')" class="py-2 px-3 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/40 text-cyan-300 font-extrabold text-xs transition-colors">

        <div class="space-y-4">

              <h2 class="text-base sm:text-lg font-extrabold text-white">8 Engineering Modules</h2>
              <p class="text-xs text-slate-400">4 Core Mechanical + 4 EV Systems with live labs &amp; drills</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button type="button" onclick="filterModules('all')" class="${tabCls('all')}">All (8)</button>
              <button type="button" onclick="filterModules('core')" class="${tabCls('core')}">Core (4)</button>
              <button type="button" onclick="filterModules('ev')" class="${tabCls('ev')}">EV (4)</button>
            </div>
          </div>
          <div class="space-y-3">${cardsHtml}</div>

      window.scrollTo({ top: 0, behavior: 'smooth' });

    function markNoteCompleted(moduleId) {
      if (!appState.completedNotes.includes(moduleId)) {
        appState.completedNotes.push(moduleId);
        appState.xp += 20;
        persistState();
      }
      renderModuleDetailView(moduleId);
    }

    function renderModuleDetailView(moduleId) {
      const container = document.getElementById('main-content');
      if (!container) return;

      const mod = MODULES.find(m => m.id === moduleId) || MODULES[0];
      const isCompleted = appState.completedNotes.includes(mod.id);

      const eqHtml = mod.equations.map(eq => `
        <div class="p-2.5 rounded-xl bg-slate-950/90 border border-slate-800 space-y-0.5">
          <p class="text-[10px] font-bold uppercase tracking-wider text-cyan-300">${escapeHTML(eq.label)}</p>
          <p class="text-xs font-mono text-slate-100 break-words">${escapeHTML(eq.formula)}</p>
        </div>`).join('');

      const linksHtml = mod.links.map(lk => `
        <a href="${lk.url}" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-950/80 hover:bg-slate-800 border border-slate-800 text-xs transition-colors">
          <span class="font-medium text-cyan-300 truncate">${escapeHTML(lk.title)}</span>
          <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 shrink-0">${escapeHTML(lk.badge)}</span>
        </a>`).join('');

      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between gap-2">

              Start 5-Q Drill →

          </div>

          <section class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-3">

              <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded-md ${mod.category === 'core' ? 'bg-indigo-500/15 text-indigo-300 border border-indigo-500/30' : 'bg-teal-500/15 text-teal-300 border border-teal-500/30'}">${mod.categoryLabel}</span>
            </div>
            <h2 class="text-base sm:text-lg font-extrabold text-white leading-snug">${escapeHTML(mod.title)}</h2>
            <p class="text-xs sm:text-sm text-slate-300 leading-relaxed">${escapeHTML(mod.overview)}</p>

            <div class="space-y-2 pt-1">

              <div class="space-y-2">${eqHtml}</div>

              <p class="text-xs text-amber-100/90 leading-relaxed">${escapeHTML(mod.interviewerTip)}</p>
            </div>

            <div class="p-3 rounded-xl bg-cyan-500/10 border border-cyan-500/30 space-y-1">
              <p class="text-[11px] font-extrabold uppercase tracking-wider text-cyan-300">Cross-Disciplinary Systems Bridge</p>

          </section>

          <!-- Schematic + Interactive Lab -->
          <section class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-3">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-cyan-300">Blueprint Schematic &amp; Interactive Lab</h3>
            ${getModuleSchematicSVG(mod.labId)}
            ${getInteractiveLabHTML(mod.labId)}

          <!-- Curated Links -->
          <section class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-2.5">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-300">Further Learning Links</h3>

          </section>

      syncAllActiveLabs();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderVisualLabsView() {
      const container = document.getElementById('main-content');
      if (!container) return;

      const labCards = MODULES.map(mod => `
        <div class="rounded-2xl bg-slate-900 border border-slate-800 p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <div>
              <span class="text-[10px] font-extrabold uppercase text-cyan-400">MOD ${mod.num} · ${escapeHTML(mod.categoryLabel)}</span>

            </div>
            <button type="button" onclick="navigate('module-detail', '${mod.id}')" class="text-xs font-bold text-cyan-300 hover:underline shrink-0">Notes →</button>

          ${getModuleSchematicSVG(mod.labId)}

      container.innerHTML = `
        <div class="space-y-4">

            <h2 class="text-base sm:text-lg font-extrabold text-white">Visual Labs — All 8 Schematics &amp; Calculators</h2>
            <p class="text-xs text-slate-400 mt-0.5">Adjust sliders live to see how mechanical, thermal, tribological, and EV parameters shift.</p>

          <div class="space-y-3">${labCards}</div>
        </div>`;

      syncAllActiveLabs();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================================
    // 8. HTML ESCAPING & BOOTSTRAP INITIALIZATION
    // =========================================================================
    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function bootApplication() {
      try {
        appState = loadPersistedState();
        updateTopHeader();
        navigate('home');
      } catch (err) {
        showGlobalError(err && err.message ? err.message : 'Initialization issue recovered.');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApplication);
    } else {
      bootApplication();
    }
  </script>
</body>
</html>
